<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدماتي — منصة الخدمات</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;font-family:Cairo,Arial;background:#f6f7f8;color:#111}header{background:#fff;border-bottom:1px solid #e6e7e9;position:sticky;top:0;z-index:5}.bar,.wrap{width:min(1120px,92%);margin:auto}.bar{height:72px;display:flex;align-items:center;gap:25px}.logo{font-size:24px;font-weight:900;margin-left:auto}.logo span{color:#777}nav{display:flex;gap:20px}nav a{font-size:13px;text-decoration:none;color:#555}.btn{border:0;border-radius:11px;padding:11px 18px;font:800 12px Cairo;cursor:pointer}.dark{background:#111;color:#fff}.hero{padding:70px 0;background:#fff}.hero h1{font-size:50px;line-height:1.2;margin:15px 0}.hero h1 span{color:#777}.hero p{color:#777;max-width:650px;line-height:2}.search{display:flex;background:#fff;border:1px solid #ddd;border-radius:15px;padding:6px;max-width:800px;margin-top:25px}.search input,.search select{border:0;outline:0;padding:12px;font:600 12px Cairo;flex:1}.section{padding:60px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.head h2{margin:5px 0;font-size:30px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid #e5e6e8;border-radius:19px;padding:20px}.cardtop{display:flex;gap:12px}.avatar{width:55px;height:55px;border-radius:15px;background:#eee;display:grid;place-items:center;font-size:25px}.card h3{margin:0;font-size:14px}.card p{font-size:11px;color:#777;line-height:1.9}.stars{font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.cat{text-align:center;cursor:pointer}.cat .icon{font-size:28px}.cat b{font-size:12px}.dashboard{display:none}.dashboard.show{display:block}.tabs{display:flex;gap:8px;margin:20px 0}.tab{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 14px;font:700 11px Cairo;cursor:pointer}.tab.active{background:#111;color:#fff}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b,.stat small{display:block}.stat b{font-size:25px}.stat small{color:#777;font-size:10px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;place-items:center;padding:20px}.modal.show{display:grid}.box{background:#fff;border-radius:20px;padding:28px;width:min(430px,100%);position:relative}.x{position:absolute;left:15px;top:12px;border:0;border-radius:50%;width:30px;height:30px}.form input,.form select,.form textarea{width:100%;margin:6px 0;padding:11px;border:1px solid #ddd;border-radius:9px;font:12px Cairo}.form textarea{min-height:90px}.form .btn{width:100%;margin-top:8px}.msg{padding:12px;border-radius:10px;background:#f0f1f2;margin:8px 0;font-size:11px}@media(max-width:700px){nav{display:none}.hero h1{font-size:37px}.cards,.grid,.statgrid{grid-template-columns:1fr}.search{display:grid}.search .btn{width:100%}}
</style></head><body>
<header><div class="bar"><div class="logo">خدماتي<span>.</span></div><nav><a href="#services">الخدمات</a><a href="#pros">المحترفون</a><a href="#dashboard">لوحتي</a></nav><button class="btn dark" onclick="openAuth()">تسجيل الدخول</button></div></header>
<section class="hero"><div class="wrap"><small>منصة خدمات تجارية</small><h1>ابحث. اختر. <span>أنجز.</span></h1><p>خدماتي تربطك بمحترفين موثوقين في مختلف المدن والخدمات.</p><div class="search"><input id="q" placeholder="مثلاً: كهربائي، سباك..."><select id="city"><option value="">كل المدن</option><option>الجزائر</option><option>وهران</option><option>سطيف</option><option>بسكرة</option><option>قسنطينة</option><option>الأغواط</option></select><button class="btn dark" onclick="loadPros()">بحث</button></div></div></section>
<section class="section" id="services"><div class="wrap"><div class="head"><h2>الخدمات</h2><small>اختر ما تحتاجه</small></div><div class="grid" id="cats"></div></div></section>
<section class="section" id="pros"><div class="wrap"><div class="head"><h2>المحترفون</h2><small id="count"></small></div><div class="cards" id="proslist"></div></div></section>
<section class="section dashboard" id="dashboard"><div class="wrap"><div class="head"><h2>لوحتي</h2><button class="btn dark" onclick="logout()">خروج</button></div><div class="statgrid"><div class="panel stat"><b id="stRequests">0</b><small>الطلبات</small></div><div class="panel stat"><b id="stCompleted">0</b><small>المكتملة</small></div><div class="panel stat"><b id="stRole">—</b><small>نوع الحساب</small></div><div class="panel stat"><b id="stName">—</b><small>الحساب</small></div></div><div class="tabs"><button class="tab active" onclick="showRequests()">طلباتي</button><button class="tab" onclick="openRequestForm()">طلب جديد</button></div><div id="requests"></div></div></section>
<div class="modal" id="modal"><div class="box"><button class="x" onclick="closeModal()">×</button><div id="body"></div></div></div>
<script>
const API=localStorage.getItem('khidmati_api')||'http://localhost:4000/api';let pros=[],user=null;
async function api(p,o={}){let h={'Content-Type':'application/json',...(o.headers||{})},t=localStorage.getItem('khidmati_token');if(t)h.Authorization='Bearer '+t;let r=await fetch(API+p,{...o,headers:h}),d=await r.json();if(!r.ok)throw Error(d.error||'خطأ');return d}
async function init(){try{let c=await api('/services');document.getElementById('cats').innerHTML=c.map(x=>`<div class="panel cat" onclick="document.getElementById('q').value='${x.name}';loadPros()"><div class="icon">${x.icon||'🛠️'}</div><b>${x.name}</b></div>`).join('');await loadPros();if(localStorage.getItem('khidmati_token')){user=await api('/me');showDash()}}catch(e){document.getElementById('proslist').innerHTML='<div class="panel">الخادم غير متصل. شغّل الـAPI ثم حدّث الصفحة.</div>'}}
async function loadPros(){let q=encodeURIComponent(document.getElementById('q').value),c=encodeURIComponent(document.getElementById('city').value);pros=await api('/professionals?q='+q+'&city='+c);document.getElementById('count').textContent=pros.length+' محترف';document.getElementById('proslist').innerHTML=pros.map(p=>`<article class="card"><div class="cardtop"><div class="avatar">🛠️</div><div><h3>${p.name} ✓</h3><p>${p.category||'محترف'} · ${p.city||'—'}</p><div class="stars">★★★★★ ${p.rating||'جديد'}</div></div></div><p>${p.bio||'محترف على منصة خدماتي.'}</p><button class="btn dark" onclick="request('${p.id}','${p.name}')">طلب خدمة</button></article>`).join('')||'<div class="panel">لا توجد نتائج.</div>'}
function openAuth(){document.getElementById('body').innerHTML=`<h2>تسجيل الدخول</h2><form class="form" onsubmit="login(event)"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="pass" type="password" placeholder="كلمة المرور" required><button class="btn dark">دخول</button></form><hr><button class="btn" onclick="registerForm()">إنشاء حساب جديد</button>`;document.getElementById('modal').classList.add('show')}
function registerForm(){document.getElementById('body').innerHTML=`<h2>إنشاء حساب</h2><form class="form" onsubmit="register(event)"><input id="name" placeholder="الاسم الكامل" required><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="pass" type="password" placeholder="كلمة المرور" required><select id="r"><option value="customer">عميل</option><option value="professional">محترف</option></select><button class="btn dark">إنشاء الحساب</button></form>`}
async function login(e){e.preventDefault();try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});localStorage.setItem('khidmati_token',d.token);user=d.user;closeModal();showDash()}catch(x){alert(x.message)}}
async function register(e){e.preventDefault();try{let d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:pass.value,role:r.value})});localStorage.setItem('khidmati_token',d.token);user=d.user;closeModal();showDash()}catch(x){alert(x.message)}}
function showDash(){document.getElementById('dashboard').classList.add('show');document.getElementById('dashboard').scrollIntoView({behavior:'smooth'});document.getElementById('stRole').textContent=user.role==='professional'?'محترف':'عميل';document.getElementById('stName').textContent=user.name;showRequests()}
async function showRequests(){try{let a=await api('/requests');document.getElementById('stRequests').textContent=a.length;document.getElementById('stCompleted').textContent=a.filter(x=>x.status==='completed').length;document.getElementById('requests').innerHTML=a.map(x=>`<div class="panel msg"><b>${x.title}</b><br>الحالة: ${x.status}<br>المحترف: ${x.professional_name||'بانتظار الاختيار'} ${user.role==='professional'&&x.status==='pending'?`<button class="btn dark" onclick="status('${x.id}','accepted')">قبول</button>`:''}</div>`).join('')||'<div class="panel">لا توجد طلبات بعد.</div>'}catch(e){document.getElementById('requests').textContent='تعذر تحميل الطلبات'}}
function request(id,name){if(!localStorage.getItem('khidmati_token'))return openAuth();document.getElementById('body').innerHTML=`<h2>طلب خدمة من ${name}</h2><form class="form" onsubmit="sendReq(event,${id})"><input id="title" placeholder="عنوان الطلب" required><textarea id="desc" placeholder="وصف الخدمة"></textarea><input id="rcity" placeholder="المدينة"><input id="date" type="datetime-local"><input id="budget" type="number" placeholder="الميزانية المتوقعة"><button class="btn dark">إرسال الطلب</button></form>`;document.getElementById('modal').classList.add('show')}
async function sendReq(e,id){e.preventDefault();try{await api('/requests',{method:'POST',body:JSON.stringify({professional_id:id,title:title.value,description:desc.value,city:rcity.value,scheduled_at:date.value||null,budget:budget.value||null})});closeModal();showDash();alert('تم إرسال الطلب')}catch(x){alert(x.message)}}
async function status(id,s){await api('/requests/'+id+'/status',{method:'PATCH',body:JSON.stringify({s})});showRequests()}
function openRequestForm(){alert('اختر محترفاً من القائمة ثم اضغط طلب خدمة.')}
function logout(){localStorage.removeItem('khidmati_token');location.reload()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
init();
</script></body></html>
